name: claude-code-latest

# The checks of ci.yml with the newest Claude Code, once a week and by hand: a
# release that changes what it requires of the hook file, or gives a `$` that
# the hook file's own shapes of it no longer accept, shows here, red, without
# failing pull requests. When it does, raise CLAUDE_CODE_VERSION in
# ci.yml. GitHub stops a schedule in a repository with no activity for 60 days.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Into a directory of its own, not the project: npm may block an install script it was
      # not told to allow (npm 12 does), so Claude Code's own is run by name; running it twice is harmless.
      - name: Install Claude Code latest
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" "@anthropic-ai/claude-code@latest"
          (cd "$RUNNER_TEMP/claude-code/node_modules/@anthropic-ai/claude-code" && node install.cjs)
          echo "CLAUDE=$RUNNER_TEMP/claude-code/node_modules/.bin/claude" >> "$GITHUB_ENV"
      - name: Claude Code's check of the hook file, newest Claude Code
        run: |
          "$CLAUDE" --version
          sh test/validate.sh
      - name: Type check of the hook file against the newest Claude Code's declarations
        run: sh test/typecheck-hooks.sh
