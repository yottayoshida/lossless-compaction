name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code that checks the hook file. claude-code-latest.yml checks the newest once a week.
  CLAUDE_CODE_VERSION: 2.1.288

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The oldest Node the package says it runs on.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Into a directory of its own, not the project: npm may block an install script it was
      # not told to allow (npm 12 does), so Claude Code's own is run by name; running it twice is harmless.
      - name: Install Claude Code ${{ env.CLAUDE_CODE_VERSION }}
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"
          (cd "$RUNNER_TEMP/claude-code/node_modules/@anthropic-ai/claude-code" && node install.cjs)
          echo "CLAUDE=$RUNNER_TEMP/claude-code/node_modules/.bin/claude" >> "$GITHUB_ENV"
      # What Claude Code requires of the hook file, which no test above can see: the
      # working tree passes, and copies broken as test/fixtures/validate says fail.
      - name: Claude Code's check of the hook file
        run: |
          "$CLAUDE" --version
          sh test/validate.sh
      # hooks/move-out.ts against the declarations that Claude Code writes when it loads the
      # plugin, with no sign-in: the working tree passes, and a copy whose shape of $ is not
      # Claude Code's fails where $ is handed to it (test/fixtures/typecheck).
      - name: Type check of the hook file against Claude Code's declarations
        run: sh test/typecheck-hooks.sh
